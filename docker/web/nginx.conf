worker_processes auto;
pid /tmp/nginx.pid;

events {
    worker_connections 1024;
}

http {
    include /etc/nginx/mime.types;
    default_type application/octet-stream;

    access_log /dev/stdout;
    error_log /dev/stderr warn;

    sendfile on;
    keepalive_timeout 65;
    server_tokens off;

    client_body_temp_path /tmp/nginx-client-body;
    proxy_temp_path /tmp/nginx-proxy;
    fastcgi_temp_path /tmp/nginx-fastcgi;
    uwsgi_temp_path /tmp/nginx-uwsgi;
    scgi_temp_path /tmp/nginx-scgi;

    server {
        listen 8080;
        server_name _;
        root /usr/share/nginx/html;
        index index.html;

        add_header X-Content-Type-Options nosniff always;
        add_header Referrer-Policy strict-origin-when-cross-origin always;
        add_header X-Frame-Options SAMEORIGIN always;

        location = /healthz {
            access_log off;
            default_type text/plain;
            return 200 "ok\n";
        }

        # Never turn a missing private/internal path into the SPA index page.
        location ~ (^|/)\. {
            return 404;
        }
        location ~ ^/(?:apps/api|db|deploy|docker|docs|ml|packages|scripts|rt_component-|Audio_detection)(?:/|$) {
            return 404;
        }
        location = /DEPLOY_VERSION.txt {
            return 404;
        }
        location ~* /(?:package(?:-lock)?\.json|Dockerfile|compose[^/]*\.ya?ml)$ {
            return 404;
        }

        location = /developer.html {
            return 301 /apps/web/developer.html;
        }
        location = /researcher.html {
            return 301 /apps/web/researcher.html;
        }
        location ~ ^/invite/([A-Za-z0-9_-]+)/?$ {
            return 302 /apps/participant-web/run_new.html?code=$1;
        }
        location ~ ^/apps/web/participant-web/(.*)$ {
            return 302 /apps/participant-web/$1$is_args$args;
        }
        location = /apps/web/run_new.html {
            return 302 /apps/participant-web/run_new.html$is_args$args;
        }
        location ~ "^(/apps/web){2,}/index\.html$" {
            return 302 /apps/web/index.html;
        }

        location ~* \.(?:css|js|mjs|wasm|png|jpe?g|gif|svg|ico|woff2?|ttf|webp|bin|task)$ {
            expires 1h;
            add_header Cache-Control "public, max-age=3600";
            try_files $uri =404;
        }

        location / {
            try_files $uri $uri/ /index.html;
        }
    }
}
