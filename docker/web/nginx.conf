worker_processes auto;
pid /tmp/nginx.pid;

events {
    worker_connections 1024;
}

http {
    include /etc/nginx/mime.types;
    types {
        application/javascript mjs;
    }
    default_type application/octet-stream;

    # Query strings, Referer and bearer invitation path segments are private.
    map $uri $wecog_log_path {
        ~*^/(?:api/)?invitations/by-code/ /invitations/by-code/REDACTED;
        ~*^/invite/ /invite/REDACTED;
        default $uri;
    }
    log_format wecog_safe escape=json '{"time":"$time_iso8601","id":"$request_id","method":"$request_method","path":"$wecog_log_path","status":$status,"seconds":$request_time}';
    # Inventory blocked scripts in the browser before switching to enforcement.
    # No report endpoint: invitation URLs must not be copied into telemetry.
    map $uri $wecog_script_policy {
        default "script-src 'self' 'wasm-unsafe-eval'; script-src-attr 'none'; worker-src 'self' blob:; object-src 'none'; base-uri 'self'";
    }
    access_log /dev/stdout wecog_safe;
    error_log /dev/stderr warn;

    sendfile on;
    keepalive_timeout 65;
    server_tokens off;

    client_body_temp_path /tmp/nginx-client-body;
    proxy_temp_path /tmp/nginx-proxy;
    fastcgi_temp_path /tmp/nginx-fastcgi;
    uwsgi_temp_path /tmp/nginx-uwsgi;
    scgi_temp_path /tmp/nginx-scgi;

    server {
        listen 8080;
        server_name _;
        root /usr/share/nginx/html;
        index index.html;

        add_header X-Content-Type-Options nosniff always;
        add_header Referrer-Policy strict-origin-when-cross-origin always;
        add_header X-Frame-Options SAMEORIGIN always;
        add_header Content-Security-Policy "frame-ancestors 'self'; base-uri 'self'; object-src 'none'" always;
        add_header Content-Security-Policy-Report-Only $wecog_script_policy always;
        add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;

        location = /healthz {
            access_log off;
            default_type text/plain;
            return 200 "ok\n";
        }

        # Never turn a missing private/internal path into the SPA index page.
        location ~ (^|/)\. {
            return 404;
        }

        # These two application-origin module trees are explicit public
        # allowlists. All sibling paths remain covered by the private rule.
        location ^~ /Audio_detection/browser/ {
            expires 1h;
            try_files $uri =404;
        }
        location ^~ /packages/shared/multimodal/ {
            expires 1h;
            try_files $uri =404;
        }

        location ~ ^/(?:apps/api|apps/researcher-web|apps/autotests|db|deploy|docker|docs|ml|packages|scripts|rt_component-|Audio_detection)(?:/|$) {
            return 404;
        }
        location = /DEPLOY_VERSION.txt {
            return 404;
        }
        location ~* /(?:package(?:-lock)?\.json|Dockerfile|compose[^/]*\.ya?ml)$ {
            return 404;
        }

        location = /developer.html {
            return 301 /apps/web/developer.html;
        }
        location = /researcher.html {
            return 301 /apps/web/researcher.html;
        }

        # Allow camera on this exact diagnostic document, not its directory.
        # Keep the staff default deny, microphone deny and JS role/account checks.
        location = /apps/web/developer/emotion-test.html {
            try_files $uri =404;
            add_header X-Content-Type-Options nosniff always;
            add_header Referrer-Policy strict-origin-when-cross-origin always;
            add_header X-Frame-Options SAMEORIGIN always;
            add_header Content-Security-Policy "frame-ancestors 'self'; base-uri 'self'; object-src 'none'" always;
            add_header Permissions-Policy "camera=(self), microphone=(), geolocation=()" always;
        }

        # Invitation URLs are bearer credentials. Participant documents need
        # media access, no-referrer, and no SPA fallback for missing assets.
        location /apps/participant-web/ {
            try_files $uri =404;
            add_header X-Content-Type-Options nosniff always;
            add_header Referrer-Policy no-referrer always;
            add_header X-Frame-Options SAMEORIGIN always;
            add_header Content-Security-Policy "frame-ancestors 'self'; base-uri 'self'; object-src 'none'" always;
            add_header Content-Security-Policy-Report-Only $wecog_script_policy always;
            add_header Permissions-Policy "camera=(self), microphone=(self), geolocation=()" always;
        }

        location ~ ^/invite/([A-Za-z0-9_-]+)/?$ {
            absolute_redirect off;
            add_header Referrer-Policy no-referrer always;
            add_header Cache-Control no-store always;
            return 302 /apps/participant-web/run_new.html?code=$1;
        }
        location = /apps/participant-web/mvp_with_precheck_1.html {
            absolute_redirect off;
            add_header Referrer-Policy no-referrer always;
            add_header Cache-Control no-store always;
            return 302 /apps/participant-web/run_new.html$is_args$args;
        }
        location ~ ^/apps/web/participant-web/(.*)$ {
            absolute_redirect off;
            add_header Referrer-Policy no-referrer always;
            add_header Cache-Control no-store always;
            return 302 /apps/participant-web/$1$is_args$args;
        }
        location = /apps/web/run_new.html {
            absolute_redirect off;
            add_header Referrer-Policy no-referrer always;
            add_header Cache-Control no-store always;
            return 302 /apps/participant-web/run_new.html$is_args$args;
        }
        location ~ "^(/apps/web){2,}/index\.html$" {
            return 302 /apps/web/index.html;
        }

        location ~* \.(?:css|js|mjs|map|wasm|png|jpe?g|gif|svg|ico|woff2?|ttf|webp|bin|task)$ {
            expires 1h;
            try_files $uri =404;
        }

        location ~* ^/(?!apps/participant-web/).*\.html$ {
            try_files $uri =404;
        }

        location / {
            try_files $uri $uri/ /index.html;
        }
    }
}
