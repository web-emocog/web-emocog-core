<!doctype html>
<html lang="ru">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>WEC · SVG screens</title>
  <style>
    :root {
      color-scheme: light;
      --canvas: #f4f7f5;
      --paper: #fff;
      --ink: #082f30;
      --brand: #007c76;
      --line: #c7d8d4;
      --muted: #5f7776;
      --signal: #ff5a36;
    }

    * { box-sizing: border-box; }

    body {
      margin: 0;
      color: var(--ink);
      background: var(--canvas);
      font-family: "Golos Text", sans-serif;
    }

    header {
      position: sticky;
      top: 0;
      z-index: 2;
      display: flex;
      gap: 24px;
      align-items: center;
      justify-content: space-between;
      padding: 18px 28px;
      color: white;
      background: var(--ink);
    }

    h1 {
      margin: 0;
      font-size: 18px;
      letter-spacing: -.02em;
    }

    .filters {
      display: flex;
      flex-wrap: wrap;
      gap: 8px;
    }

    button {
      min-height: 36px;
      padding: 0 14px;
      color: white;
      background: transparent;
      border: 1px solid #426667;
      border-radius: 999px;
      font: inherit;
      font-size: 12px;
      font-weight: 700;
      cursor: pointer;
    }

    button[aria-pressed="true"] {
      color: var(--ink);
      background: white;
      border-color: white;
    }

    main {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(320px, 1fr));
      gap: 20px;
      padding: 28px;
    }

    article {
      overflow: hidden;
      background: var(--paper);
      border: 1px solid var(--line);
      border-radius: 16px;
    }

    article[data-size="desktop"] { grid-column: span 2; }

    .preview {
      display: grid;
      min-height: 280px;
      place-items: center;
      padding: 16px;
      background:
        linear-gradient(45deg, #eef3f1 25%, transparent 25%),
        linear-gradient(-45deg, #eef3f1 25%, transparent 25%),
        linear-gradient(45deg, transparent 75%, #eef3f1 75%),
        linear-gradient(-45deg, transparent 75%, #eef3f1 75%);
      background-position: 0 0, 0 8px, 8px -8px, -8px 0;
      background-size: 16px 16px;
    }

    img {
      display: block;
      width: 100%;
      max-height: 520px;
      object-fit: contain;
      background: white;
    }

    .meta {
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 14px 16px;
      border-top: 1px solid var(--line);
    }

    .name {
      font-size: 13px;
      font-weight: 700;
    }

    .tag {
      color: var(--brand);
      font-family: "IBM Plex Mono", monospace;
      font-size: 10px;
      text-transform: uppercase;
    }

    .empty {
      grid-column: 1 / -1;
      padding: 60px;
      color: var(--muted);
      text-align: center;
    }

    @media (max-width: 760px) {
      header {
        align-items: flex-start;
        flex-direction: column;
        padding: 16px;
      }

      main {
        grid-template-columns: 1fr;
        padding: 16px;
      }

      article[data-size="desktop"] { grid-column: span 1; }
    }
  </style>
</head>
<body>
  <header>
    <h1>WEC · SVG screens</h1>
    <nav class="filters" aria-label="Фильтры">
      <button type="button" data-filter="all" aria-pressed="true">Все</button>
      <button type="button" data-filter="researcher">Исследователь</button>
      <button type="button" data-filter="participant">Участник</button>
      <button type="button" data-filter="system">Система</button>
      <button type="button" data-filter="desktop">Desktop</button>
      <button type="button" data-filter="mobile">Mobile</button>
    </nav>
  </header>
  <main id="gallery" aria-live="polite"></main>
  <script>
    const gallery = document.querySelector("#gallery");
    const controls = [...document.querySelectorAll("[data-filter]")];
    let screens = [];
    let filter = "all";

    function render() {
      const visible = screens.filter(screen =>
        filter === "all" ||
        screen.audience === filter ||
        screen.size === filter
      );

      gallery.innerHTML = visible.length
        ? visible.map(screen => `
          <article data-size="${screen.size}">
            <a class="preview" href="${screen.file}" target="_blank" rel="noreferrer">
              <img src="${screen.file}" alt="${screen.id} ${screen.title} ${screen.size}" loading="lazy">
            </a>
            <div class="meta">
              <span class="name">${screen.id} · ${screen.title}</span>
              <span class="tag">${screen.size}</span>
            </div>
          </article>
        `).join("")
        : '<p class="empty">Нет экранов.</p>';
    }

    controls.forEach(control => {
      control.addEventListener("click", () => {
        filter = control.dataset.filter;
        controls.forEach(item => item.setAttribute("aria-pressed", String(item === control)));
        render();
      });
    });

    fetch("screens/manifest.json")
      .then(response => response.json())
      .then(data => {
        screens = data;
        render();
      })
      .catch(() => {
        gallery.innerHTML = '<p class="empty">Запустите локальный HTTP-сервер.</p>';
      });
  </script>
</body>
</html>
