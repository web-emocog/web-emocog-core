</text><text x="64" y="488" fill="#006B66" font-family="IBM Plex Mono, monospace" font-size="13" font-weight="400">IBM PLEX MONO · QC 0.83 · SESSION S-1042</text><rect x="64" y="548" width="164" height="44" rx="10" fill="#006B66" stroke="#006B66" stroke-width="1"/><text x="146" y="576" fill="#FFFFFF" font-family="Golos Text, Arial, sans-serif" font-size="13" font-weight="700" text-anchor="middle">Продолжить</text><rect x="244" y="548" width="126" height="44" rx="10" fill="#FFFFFF" stroke="#789692" stroke-width="1.5"/><text x="307" y="576" fill="#062D2E" font-family="Golos Text, Arial, sans-serif" font-size="13" font-weight="700" text-anchor="middle">Назад</text><rect x="390" y="556" width="98" height="28" rx="14" fill="#DCFAE6"/><text x="439" y="574" fill="#067647" font-family="Golos Text, Arial, sans-serif" font-size="11" font-weight="700" text-anchor="middle" letter-spacing="0.2">QC 0.91</text><rect x="502" y="556" width="98" height="28" rx="14" fill="#FEE4E2"/><text x="551" y="574" fill="#B42318" font-family="Golos Text, Arial, sans-serif" font-size="11" font-weight="700" text-anchor="middle" letter-spacing="0.2">QC 0.42</text><text x="64" y="638" fill="#4F6B6A" font-family="Golos Text, Arial, sans-serif" font-size="11" font-weight="700" letter-spacing="0.6">НАЗВАНИЕ</text><rect x="64" y="650" width="360" height="52" rx="10" fill="#FFFFFF" stroke="#789692" stroke-width="1.5"/><text x="78" y="682" fill="#062D2E" font-family="Golos Text, Arial, sans-serif" font-size="14" font-weight="400">Шрифтовые пары</text><text x="444" y="638" fill="#4F6B6A" font-family="Golos Text, Arial, sans-serif" font-size="11" font-weight="700" letter-spacing="0.6">ОШИБКА</text><rect x="444" y="650" width="360" height="52" rx="10" fill="#FFFFFF" stroke="#B42318" stroke-width="2"/><text x="458" y="682" fill="#062D2E" font-family="Golos Text, Arial, sans-serif" font-size="14" font-weight="400">Обязательное поле</text><text x="444" y="722" fill="#B42318" font-family="Golos Text, Arial, sans-serif" font-size="11" font-weight="600">Заполните поле</text><rect x="840" y="384" width="536" height="390" rx="14" fill="#062D2E"/><text x="872" y="430" fill="#FFFFFF" font-family="Golos Text, Arial, sans-serif" font-size="20" font-weight="750">Правила</text><text x="872" y="486" fill="#FFFFFF" font-family="Golos Text, Arial, sans-serif" font-size="15" font-weight="650">Без декоративных подписей</text><text x="872" y="528" fill="#FFFFFF" font-family="Golos Text, Arial, sans-serif" font-size="15" font-weight="650">Не более одного primary action</text><text x="872" y="570" fill="#FFFFFF" font-family="Golos Text, Arial, sans-serif" font-size="15" font-weight="650">No data ≠ 0</text><text x="872" y="612" fill="#FFFFFF" font-family="Golos Text, Arial, sans-serif" font-size="15" font-weight="650">Low confidence видим</text><text x="872" y="654" fill="#FFFFFF" font-family="Golos Text, Arial, sans-serif" font-size="15" font-weight="650">Off-screen не исправляется UI</text><text x="872" y="696" fill="#FFFFFF" font-family="Golos Text, Arial, sans-serif" font-size="15" font-weight="650">Контраст WCAG AA</text><rect x="872" y="724" width="84" height="7" rx="3.5" fill="#2563EB"/>
