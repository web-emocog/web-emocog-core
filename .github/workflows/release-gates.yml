name: Release gates

on:
  pull_request:
    branches: [develop, main]
  push:
    branches: [develop, main]
  merge_group:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: release-gates-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  NODE_ENV: test
  CI: 'true'

jobs:
  api-security:
    name: API, RT and security contracts
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v4.4.0
      - name: Set up Node.js
        uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v4.4.0
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: apps/api/package-lock.json
      - name: Install API dependencies
        working-directory: apps/api
        run: npm ci
      - name: Audit production dependencies
        working-directory: apps/api
        shell: bash
        run: |
          set -o pipefail

          audit_log="$(mktemp)"
          trap 'rm -f "$audit_log"' EXIT

          for attempt in 1 2 3; do
            : > "$audit_log"
            if npm audit \
              --omit=dev \
              --audit-level=high \
              --fetch-retries=0 \
              --fetch-timeout=30000 \
              2>&1 | tee "$audit_log"
            then
              exit 0
            fi

            if ! grep -Eqi \
              '^(npm warn audit|npm error).*(network timeout|503 service unavailable|502 bad gateway|504 gateway timeout|429 too many requests|EAI_AGAIN|ECONNRESET|ECONNREFUSED|ENETUNREACH|ETIMEDOUT|socket hang up)' \
              "$audit_log"
            then
              echo 'npm audit reported a non-transient failure; refusing to retry.' >&2
              exit 1
            fi

            if (( attempt == 3 )); then
              warning='npm audit was unavailable after 3 attempts. No vulnerability result was returned; Dependabot and the next release-gate run remain the fallback checks.'
              echo "::warning title=Dependency audit unavailable::${warning}"
              {
                echo '### Dependency audit warning'
                echo
                echo "${warning}"
              } >> "$GITHUB_STEP_SUMMARY"
              exit 0
            fi

            delay=$((attempt * 10))
            echo "Transient npm registry failure; retrying in ${delay}s." >&2
            sleep "$delay"
          done
      - name: Static release audit
        working-directory: apps/api
        run: node scripts/release-audit.js
      - name: API unit, contract and security tests
        working-directory: apps/api
        run: npm test
      - name: RT Python smoke
        working-directory: apps/api
        run: npm run test:rt-python

  postgres-release:
    name: PostgreSQL, migration, restore and ingest load
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    env:
      DATABASE_URL: postgres://postgres:postgres@127.0.0.1:5432/emocog_test
      S2_TEST_DATABASE_URL: postgres://postgres:postgres@127.0.0.1:5432/emocog_test
      RESTORE_DATABASE_URL: postgres://postgres:postgres@127.0.0.1:5432/emocog_restore
      JWT_SECRET: ci-only-random-secret-not-used-outside-workflow-1234567890
      FORCE_HTTPS: 'false'
      INGEST_RATE_LIMIT_PER_MINUTE: '1000'
      DEFAULT_RATE_LIMIT_PER_MINUTE: '1000'
      RELEASE_SHA: ${{ github.sha }}
      RELEASE_VERSION: ci
    steps:
      - name: Checkout
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v4.4.0
      - name: Start digest-pinned PostgreSQL with a registry fallback
        id: postgres
        run: bash scripts/start-ci-postgres.sh
      - name: Set up Node.js
        uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v4.4.0
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: |
            apps/api/package-lock.json
            apps/autotests/package-lock.json
      - name: Install PostgreSQL and media tools
        run: sudo apt-get update && sudo apt-get install -y postgresql-client-16 ffmpeg poppler-utils
      - name: Install API dependencies
        working-directory: apps/api
        run: npm ci
      - name: Create disposable restore database
        run: PGPASSWORD=postgres createdb -h 127.0.0.1 -U postgres emocog_restore
      - name: Verify migrations up, down and up
        working-directory: apps/api
        env:
          MIGRATION_VERIFY_ALLOW_DOWN: 'YES'
        run: npm run migrate:verify
      - name: PostgreSQL concurrency and negative security tests
        working-directory: apps/api
        env:
          AUTH_RATE_LIMIT_PER_MINUTE: '1000'
          INGEST_RATE_LIMIT_PER_MINUTE: '1000'
          IDENTITY_TEST_DATABASE_URL: postgres://postgres:postgres@127.0.0.1:5432/emocog_test
          MEDIA_TEST_DATABASE_URL: postgres://postgres:postgres@127.0.0.1:5432/emocog_test
          MEDIA_TEST_ISOLATED: '1'
        run: npm run test:postgres
      - name: Start canonical API
        working-directory: apps/api
        run: |
          node server.js > /tmp/wecog-api.log 2>&1 &
          echo $! > /tmp/wecog-api.pid
          for attempt in $(seq 1 30); do
            curl --fail --silent http://127.0.0.1:3000/ready && exit 0
            sleep 1
          done
          cat /tmp/wecog-api.log
          exit 1
      - name: Real HTTP API contract
        working-directory: apps/autotests
        env:
          RUN_API_CONTRACT: '1'
          API_BASE: http://127.0.0.1:3000
        run: |
          npm ci
          npm run test:api
      - name: Verify complete participant delivery against a real API
        working-directory: apps/autotests
        env:
          RESILIENCE_TEST_DATABASE_URL: postgres://postgres:postgres@127.0.0.1:5432/protocol_fixes_test
        run: |
          PGPASSWORD=postgres createdb -h 127.0.0.1 -U postgres protocol_fixes_test
          (cd ../api && DATABASE_URL="$RESILIENCE_TEST_DATABASE_URL" npm run migrate:up)
          npx playwright install --with-deps chromium firefox
          npx playwright test -c playwright.session-live.config.ts --project=chromium --project=firefox
      - name: Idempotent ingest load profile
        working-directory: apps/api
        env:
          LOAD_TEST_ALLOW_MUTATION: 'YES'
          LOAD_TEST_REQUESTS: '100'
          LOAD_TEST_CONCURRENCY: '10'
          LOAD_TEST_MAX_ERROR_RATE: '0.01'
        run: npm run load:ingest
      - name: Backup and restore drill
        working-directory: apps/api
        run: npm run backup:verify
      - name: Gracefully stop API
        if: always()
        run: |
          if [[ -f /tmp/wecog-api.pid ]]; then
            kill -TERM "$(cat /tmp/wecog-api.pid)" || true
            for attempt in $(seq 1 30); do
              kill -0 "$(cat /tmp/wecog-api.pid)" 2>/dev/null || break
              sleep 1
            done
          fi
          cat /tmp/wecog-api.log 2>/dev/null || true
          if [[ "${{ job.status }}" == "success" ]]; then
            grep -q 'api_shutdown_completed' /tmp/wecog-api.log
          fi
      - name: Stop disposable PostgreSQL
        if: ${{ always() && steps.postgres.outcome == 'success' }}
        run: docker rm --force "${{ steps.postgres.outputs.container }}"

  browser-regression:
    name: Chromium and Firefox critical paths
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    steps:
      - name: Checkout
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v4.4.0
      - name: Set up Node.js
        uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v4.4.0
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: apps/autotests/package-lock.json
      - name: Install browser test dependencies
        working-directory: apps/autotests
        run: npm ci
      - name: Install supported browsers
        working-directory: apps/autotests
        run: npx playwright install --with-deps chromium firefox
      - name: Typecheck browser contracts
        working-directory: apps/autotests
        run: npm run typecheck
      - name: Provide a local audio output for native media tests
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends pulseaudio
          pulseaudio --start --exit-idle-time=-1
          pactl load-module module-null-sink sink_name=wecog_ci
          pactl set-default-sink wecog_ci
      - name: Run browser regression
        working-directory: apps/autotests
        run: npm test
      - name: Upload failure evidence
        if: failure()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: playwright-failure-${{ github.run_id }}
          path: |
            apps/autotests/test-results
            apps/autotests/playwright-report
          retention-days: 7

  frame-pipeline-regression:
    name: Frame pipeline and FPS diagnostics (ubuntu-24.04)
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    env:
      WECOG_TEST_HEADED: '1'
      WECOG_TEST_ENGINES: chromium,firefox
      LIBGL_ALWAYS_SOFTWARE: 'true'
      GALLIUM_DRIVER: llvmpipe
    steps:
      - name: Checkout
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v4.4.0
      - name: Set up Node.js
        uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v4.4.0
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: apps/autotests/package-lock.json
      - name: Install browser test dependencies
        working-directory: apps/autotests
        run: npm ci
      - name: Install Chromium and Firefox
        working-directory: apps/autotests
        run: npx playwright install --with-deps chromium firefox
      - name: Install software OpenGL for the virtual display
        run: sudo apt-get install --yes --no-install-recommends libgl1-mesa-dri libegl-mesa0 mesa-utils
      - name: Verify window and Worker WebGL2 in every engine
        working-directory: apps/autotests
        shell: bash
        run: xvfb-run --auto-servernum npm run test:vision-gl
      - name: Run isolated frame pipeline regression
        working-directory: apps/autotests
        shell: bash
        run: xvfb-run --auto-servernum npm run test:frame-workers -- --project=chromium --project=firefox
      - name: Run isolated FPS and quality diagnostics
        working-directory: apps/autotests
        run: npm run test:fps -- --project=chromium --project=firefox
      - name: Run isolated staff HTTP resilience and data boundary checks
        working-directory: apps/autotests
        run: |
          npm run test:staff-http -- --project=chromium --project=firefox
          npm run test:html-security -- --project=chromium --project=firefox
          npm run test:staff-regression -- --project=chromium --project=firefox
          npx playwright test -c playwright.identity.config.ts --project=chromium --project=firefox
          npx playwright test -c playwright.block-media.config.ts --project=chromium --project=firefox
      - name: Verify corrected VPC metrics and real stimulus presentation
        working-directory: apps/autotests
        run: npx playwright test -c playwright.metrics.config.ts --project=chromium --project=firefox
      - name: Verify audit data boundaries and cancelled protocol loads
        working-directory: apps/autotests
        run: |
          npx playwright test -c playwright.old-audit-builder.config.ts --project=chromium --project=firefox
          npx playwright test -c playwright.old-audit-stimuli-security.config.ts --project=chromium --project=firefox
          npx playwright test -c playwright.old-audit-analytics.config.ts --project=chromium --project=firefox
          npx playwright test -c playwright.old-audit-network.config.ts --project=chromium --project=firefox
      - name: Upload failure evidence
        if: failure()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: frame-pipeline-failure-ubuntu-24.04-${{ github.run_id }}
          path: |
            apps/autotests/test-results
          retention-days: 7

  release-gate:
    name: Required release gate
    # Superseded runs are cancelled by the workflow concurrency policy. Do not
    # relabel those stale runs as failures, while still evaluating real failures.
    if: ${{ always() && !cancelled() }}
    needs: [api-security, postgres-release, browser-regression, frame-pipeline-regression]
    runs-on: ubuntu-24.04
    steps:
      - name: Require every release job
        env:
          API_RESULT: ${{ needs.api-security.result }}
          POSTGRES_RESULT: ${{ needs.postgres-release.result }}
          BROWSER_RESULT: ${{ needs.browser-regression.result }}
          FRAME_PIPELINE_RESULT: ${{ needs.frame-pipeline-regression.result }}
        run: |
          [[ "$API_RESULT" == "success" ]]
          [[ "$POSTGRES_RESULT" == "success" ]]
          [[ "$BROWSER_RESULT" == "success" ]]
          [[ "$FRAME_PIPELINE_RESULT" == "success" ]]
