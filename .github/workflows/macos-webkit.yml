name: macOS WebKit checks

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: macos-webkit-${{ github.ref }}
  cancel-in-progress: true

env:
  NODE_ENV: test
  CI: 'true'
  WECOG_TEST_HEADED: '0'
  WECOG_TEST_ENGINES: webkit

jobs:
  frame-pipeline-webkit:
    name: Frame pipeline and FPS diagnostics (macos-15)
    runs-on: macos-15
    timeout-minutes: 30
    defaults:
      run:
        working-directory: apps/autotests
    steps:
      - name: Checkout
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v4.4.0
        with:
          persist-credentials: false
      - name: Set up Node.js
        uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v4.4.0
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: apps/autotests/package-lock.json
      - name: Install browser test dependencies
        run: npm ci
      - name: Install WebKit
        run: npx playwright install --with-deps webkit
      - name: Verify window and Worker WebGL2
        run: npm run test:vision-gl
      - name: Run isolated frame pipeline regression
        run: npm run test:frame-workers -- --project=webkit
      - name: Run isolated FPS and quality diagnostics
        run: npm run test:fps -- --project=webkit
      - name: Run isolated staff HTTP resilience and data boundary checks
        run: |
          npm run test:staff-http -- --project=webkit
          npm run test:html-security -- --project=webkit
          npm run test:staff-regression -- --project=webkit
      - name: Verify corrected VPC metrics and real stimulus presentation
        run: npx playwright test -c playwright.metrics.config.ts --project=webkit
      - name: Verify gaze calibration and developer diagnostics
        run: npx playwright test -c playwright.issue143.config.ts --project=webkit
      - name: Verify audit data boundaries and cancelled protocol loads
        run: |
          npx playwright test -c playwright.old-audit-builder.config.ts --project=webkit
          npx playwright test -c playwright.old-audit-stimuli-security.config.ts --project=webkit
          npx playwright test -c playwright.old-audit-analytics.config.ts --project=webkit
          npx playwright test -c playwright.old-audit-network.config.ts --project=webkit
      - name: Upload failure evidence
        if: failure()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: frame-pipeline-failure-macos-15-${{ github.run_id }}
          path: apps/autotests/test-results
          retention-days: 7
