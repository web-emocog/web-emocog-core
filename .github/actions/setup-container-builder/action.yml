name: Set up verified container builder
description: Use a digest-pinned BuildKit cache with a canonical upstream fallback
runs:
  using: composite
  steps:
    - name: Start BuildKit from the Google Docker Hub cache
      id: mirror
      continue-on-error: true
      uses: docker/setup-buildx-action@d7f5e7f509e45cec5c76c4d5afdd7de93d0b3df5 # v4.1.0
      with:
        driver-opts: image=mirror.gcr.io/moby/buildkit@sha256:cec9f139f45e93c5c69c60f8b07cfad9f43f4ef6b6a6cd917527fea5ff2e3dea
        buildkitd-config: ${{ github.action_path }}/buildkitd.toml
    - name: Fall back to the identical upstream BuildKit image
      if: steps.mirror.outcome == 'failure'
      uses: docker/setup-buildx-action@d7f5e7f509e45cec5c76c4d5afdd7de93d0b3df5 # v4.1.0
      with:
        driver-opts: image=moby/buildkit@sha256:cec9f139f45e93c5c69c60f8b07cfad9f43f4ef6b6a6cd917527fea5ff2e3dea
        buildkitd-config: ${{ github.action_path }}/buildkitd.toml
