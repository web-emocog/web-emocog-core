name: Bound Ubuntu APT network waits
description: Keep Ubuntu publisher keys and suites, avoid slow EC2 mirrors in sources and mirror lists, and bound APT requests including Playwright subprocesses.
runs:
  using: composite
  steps:
    - shell: bash
      run: |
        # Change transport/host only for the Ubuntu EC2 mirror observed stalling
        # on large packages. Keep suites, components, Signed-By and other vendors.
        sources=()
        for source in /etc/apt/sources.list /etc/apt/sources.list.d/*.sources /etc/apt/sources.list.d/*.list \
          /etc/apt/apt-mirrors.txt /etc/apt/apt-mirrors-security.txt; do
          if [[ -f "$source" ]]; then sources+=("$source"); fi
        done
        if (( ${#sources[@]} )); then
          sudo sed -E -i -f "$GITHUB_ACTION_PATH/ubuntu-origin.sed" "${sources[@]}"
        fi
        printf '%s\n' \
          'Acquire::Retries "1";' \
          'Acquire::http::Timeout "5";' \
          'Acquire::https::Timeout "5";' \
          | sudo tee /etc/apt/apt.conf.d/99-wecog-ci-network >/dev/null
