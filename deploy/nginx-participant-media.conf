# Include inside a legacy production `server` block that serves the repository
# root. The containerized deployment implements the same policy directly in
# `docker/web/nginx.conf`.
# Keep the API policy stricter: API responses intentionally use camera=(), microphone=().

# Modern nginx installations may not include mjs in the default mime.types.
# If the parent configuration already includes this file, keep only the small
# `types` block below.
include /etc/nginx/mime.types;
types {
    application/javascript mjs;
}

location ^~ /apps/participant-web/ {
    try_files $uri =404;
    add_header Permissions-Policy "camera=(self), microphone=(self), geolocation=()" always;
    add_header Content-Security-Policy "frame-ancestors 'self'; base-uri 'self'; object-src 'none'" always;
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header Referrer-Policy "no-referrer" always;
    add_header X-Content-Type-Options "nosniff" always;
}

location ^~ /apps/web/ {
    try_files $uri =404;
    add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;
    add_header Content-Security-Policy "frame-ancestors 'self'; base-uri 'self'; object-src 'none'" always;
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header Referrer-Policy "no-referrer" always;
    add_header X-Content-Type-Options "nosniff" always;
}

location ^~ /Audio_detection/browser/ {
    try_files $uri =404;
    add_header Content-Security-Policy "frame-ancestors 'none'; base-uri 'none'; object-src 'none'" always;
    add_header X-Content-Type-Options "nosniff" always;
}

location ^~ /packages/shared/multimodal/ {
    try_files $uri =404;
    add_header Content-Security-Policy "frame-ancestors 'none'; base-uri 'none'; object-src 'none'" always;
    add_header X-Content-Type-Options "nosniff" always;
}
