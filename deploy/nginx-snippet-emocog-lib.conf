# Фрагмент для nginx: отдача каталога lib (rPPG и др.) рядом с apps.
# Корень развёрнутого main на диске — например /var/www/emocog
# После правок: sudo nginx -t && sudo systemctl reload nginx
#
# --- Если фронт открывается с корня сайта (root = /var/www/emocog) и URL к JS: https://wecog.ru/lib/... ---
location ^~ /lib/ {
    alias /var/www/emocog/lib/;
    # После обновления rPPG: иначе браузер долго держит ES-модули (.js) из кэша.
    # add_header Cache-Control "no-cache" always;
}
#
# --- Если префикс сайта /main/ и из-за alias ломается только /main/lib/ ---
# location ^~ /main/lib/ {
#     alias /var/www/emocog/lib/;
# }
