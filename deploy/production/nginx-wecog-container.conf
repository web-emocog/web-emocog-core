server {
    listen 80;
    server_name wecog.ru www.wecog.ru;
    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl http2;
    server_name wecog.ru www.wecog.ru;

    ssl_certificate /etc/letsencrypt/live/wecog.ru/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/wecog.ru/privkey.pem;

    client_max_body_size 55m;
    include /etc/nginx/snippets/wecog-private-paths.conf;

    location /api/ {
        proxy_pass http://127.0.0.1:3000/;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_connect_timeout 10s;
        proxy_send_timeout 120s;
        proxy_read_timeout 120s;
    }

    location / {
        proxy_pass http://127.0.0.1:8080;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_connect_timeout 10s;
        proxy_send_timeout 120s;
        proxy_read_timeout 120s;
    }
}
