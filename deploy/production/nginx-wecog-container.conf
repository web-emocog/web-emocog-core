# Included at http scope (sites-enabled). Do not log invitation credentials.
map $uri $wecog_edge_log_path {
    ~*^/(?:api/)?invitations/by-code/ /invitations/by-code/REDACTED;
    ~*^/invite/ /invite/REDACTED;
    default $uri;
}
log_format wecog_edge_safe escape=json '{"time":"$time_iso8601","id":"$request_id","method":"$request_method","path":"$wecog_edge_log_path","status":$status,"seconds":$request_time}';

server {
    listen 80;
    server_name wecog.ru www.wecog.ru;
    access_log /var/log/nginx/wecog-access.log wecog_edge_safe;
    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl http2;
    server_name wecog.ru www.wecog.ru;
    access_log /var/log/nginx/wecog-access.log wecog_edge_safe;

    ssl_certificate /etc/letsencrypt/live/wecog.ru/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/wecog.ru/privkey.pem;

    client_max_body_size 55m;
    include /etc/nginx/snippets/wecog-private-paths.conf;

    # Narrow public exceptions to the otherwise private source trees. The ^~
    # prefix prevents the private regex include from intercepting these paths.
    location ^~ /Audio_detection/browser/ {
        proxy_pass http://127.0.0.1:8080;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_connect_timeout 10s;
        proxy_send_timeout 120s;
        proxy_read_timeout 120s;
    }

    location ^~ /packages/shared/multimodal/ {
        proxy_pass http://127.0.0.1:8080;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_connect_timeout 10s;
        proxy_send_timeout 120s;
        proxy_read_timeout 120s;
    }

    location /api/ {
        proxy_pass http://127.0.0.1:3000/;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_connect_timeout 10s;
        proxy_send_timeout 120s;
        proxy_read_timeout 120s;
    }

    location / {
        proxy_pass http://127.0.0.1:8080;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_connect_timeout 10s;
        proxy_send_timeout 120s;
        proxy_read_timeout 120s;
    }
}
