# Prevent internal repository files from falling through to the SPA index.
location ~ (^|/)\. { return 404; }
location ~ ^/(apps/api|db|deploy|docker|docs|ml|packages|scripts|rt_component-|Audio_detection)(/|$) { return 404; }
location = /DEPLOY_VERSION.txt { return 404; }
location ~* /(?:package(?:-lock)?\.json|Dockerfile|compose[^/]*\.ya?ml)$ { return 404; }
