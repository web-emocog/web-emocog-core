receivers:
  prometheus:
    config:
      global:
        scrape_interval: 60s
        scrape_timeout: 15s
      scrape_configs:
        - job_name: wecog_public_https
          metrics_path: /probe
          params:
            module: [https_2xx]
          static_configs:
            - targets:
                - https://wecog.ru/
              labels:
                probe_type: https
                target_name: web_root
            - targets:
                - https://wecog.ru/api/ready
              labels:
                probe_type: https
                target_name: api_ready
          relabel_configs:
            - source_labels: [__address__]
              target_label: __param_target
            - source_labels: [__param_target]
              target_label: instance
            - target_label: __address__
              replacement: blackbox-exporter:9115
          metric_relabel_configs:
            - source_labels: [__name__]
              regex: probe_(success|duration_seconds|http_status_code|ssl_earliest_cert_expiry)
              action: keep

        - job_name: wecog_host_memory
          static_configs:
            - targets: [node-exporter:9100]
              labels:
                target_name: production_vm
          metric_relabel_configs:
            - source_labels: [__name__]
              regex: node_memory_(MemAvailable|MemTotal)_bytes
              action: keep

        - job_name: wecog_host_root_filesystem
          static_configs:
            - targets: [node-exporter:9100]
              labels:
                target_name: production_vm
          metric_relabel_configs:
            - source_labels: [__name__]
              regex: node_filesystem_(avail_bytes|size_bytes|readonly)
              action: keep
            - source_labels: [mountpoint]
              regex: ^/(rootfs)?$
              action: keep

        - job_name: wecog_backups
          static_configs:
            - targets: [node-exporter:9100]
              labels:
                target_name: production_vm
          metric_relabel_configs:
            - source_labels: [__name__]
              regex: wecog_backup_(last_success_timestamp_seconds|last_attempt_timestamp_seconds|last_run_success|in_progress|uploads_files)|node_time_seconds|node_textfile_scrape_error
              action: keep

processors:
  memory_limiter:
    check_interval: 5s
    limit_mib: 192
    spike_limit_mib: 48
  batch:
    timeout: 10s
    send_batch_size: 256

exporters:
  otlp/monium:
    endpoint: ingest.monium.yandex.cloud:443
    compression: zstd
    headers:
      Authorization: "Api-Key ${env:MONIUM_API_KEY}"
      x-monium-project: "${env:MONIUM_PROJECT}"
      x-monium-cluster: "${env:MONIUM_CLUSTER}"
      x-monium-service: "${env:MONIUM_SERVICE}"

service:
  telemetry:
    logs:
      level: info
  pipelines:
    metrics:
      receivers: [prometheus]
      processors: [memory_limiter, batch]
      exporters: [otlp/monium]
