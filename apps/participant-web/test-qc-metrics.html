<html lang="ru">
<head>

  <link rel="stylesheet" href="../web/assets/wecog-foundation.css?v=20260820-1">

  <style>body{max-width:1100px;margin:auto;padding:24px;font-family:"Atkinson Hyperlegible Next",sans-serif}main{display:grid;grid-template-columns:1fr 1fr;gap:20px}.card{padding:22px;border:1px solid var(--stroke,#abb8b1);border-radius:18px;min-width:0}video{width:100%;max-height:440px}pre{white-space:pre-wrap;overflow-wrap:anywhere}button{padding:12px 20px;margin:8px} @media(max-width:700px){main{grid-template-columns:1fr}}</style>
</head>
<body>
  <script src="../web/api-base.js?v=20260819-1"></script>

  <script src="../web/staff-session.js?v=20261027-1"></script>
  <script src="../web/auth-guard.js?v=20261027-1"></script>
  <script>
    if (!window.EmocogAuthGuard) location.replace('../web/developer/login.html');
    else window.WecogDiagnosticAccess = window.EmocogAuthGuard.ensureProtectedPage({ loginPath:'../web/developer/login.html', allowedRoles:['admin','developer'], preserveAuthOnRoleDenied:true, roleDeniedRedirect:'../web/researcher.html' });
  </script>
  <header><h1>QC протокола</h1><a href="../web/developer.html?v=20261104-4">К диагностике</a></header>
  <p>Реальный QCMetrics и обработчики протокола. Случайные точки и устаревшие синтетические проверки не используются. Видео и кадры не сохраняются.</p>
  <main>
    <section class="card"><video id="video" muted playsinline></video><button id="btnStart" type="button">Запустить камеру</button><button id="btnStop" type="button" disabled>Остановить</button><p id="status" role="status">Камера не запрашивалась.</p></section>
    <section class="card"><h2>Текущие показатели QC</h2><pre id="qcDetails">Нет измерений</pre></section>
  </main>
  <script type="module" src="../web/developer/qc-test.js?v=20261112-emotion2"></script>

</html>
