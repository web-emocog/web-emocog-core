<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="referrer" content="no-referrer">
  <title>wecog — приглашение участника</title>
  <link rel="icon" href="../web/assets/wecog-mark.svg" type="image/svg+xml">
  <style>
    :root {
      --bg: #0f0f1a;
      --card: #16213e;
      --text: #e8e8f0;
      --muted: #94a3b8;
      --accent: #5C66BD;
      --border: rgba(92, 102, 189, 0.28);
      --good: #10B981;
    }
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      min-height: 100vh;
      font-family: system-ui, -apple-system, sans-serif;
      background: radial-gradient(1200px 800px at 20% 0%, rgba(92, 102, 189, .2), transparent 55%), var(--bg);
      color: var(--text);
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 24px;
    }
    .box {
      width: 100%;
      max-width: 520px;
      background: var(--card);
      border: 1px solid var(--border);
      border-radius: 20px;
      padding: 28px;
      box-shadow: 0 16px 48px rgba(0, 0, 0, .35);
    }
    h1 { font-size: 1.35rem; margin-bottom: 8px; }
    .sub { color: var(--muted); font-size: 14px; margin-bottom: 20px; line-height: 1.45; }
    label { display: block; font-size: 13px; color: var(--muted); margin-bottom: 6px; }
    textarea {
      width: 100%;
      min-height: 100px;
      padding: 12px;
      border-radius: 12px;
      border: 1px solid var(--border);
      background: rgba(0, 0, 0, .25);
      color: var(--text);
      font-size: 14px;
      resize: vertical;
      margin-bottom: 14px;
    }
    textarea:focus { outline: none; border-color: var(--accent); }
    .row { display: flex; gap: 12px; flex-wrap: wrap; align-items: center; }
    button {
      padding: 12px 20px;
      border: none;
      border-radius: 12px;
      background: var(--accent);
      color: #fff;
      font-weight: 600;
      cursor: pointer;
      font-size: 15px;
    }
    button:hover { opacity: .93; }
    a.home {
      color: var(--muted);
      font-size: 14px;
      text-decoration: none;
    }
    a.home:hover { color: var(--accent); }
    #err { color: #f87171; font-size: 13px; margin-top: 10px; min-height: 1.2em; }
    .hint { font-size: 12px; color: var(--muted); margin-top: 14px; line-height: 1.4; }
  </style>
  <link rel="stylesheet" href="participant-redesign.css?v=20260819-1">
  <style>
    body { padding: 28px; align-items: center; }
    .box {
      max-width: 620px;
      padding: clamp(28px, 6vw, 56px);
      border: 1px solid var(--border);
      border-radius: 28px;
      background: #fff;
      color: var(--text-main);
      box-shadow: 0 24px 70px rgba(16,33,27,.09);
    }
    .invite-top { display: flex; align-items: center; justify-content: space-between; gap: 16px; margin-bottom: 52px; }
    .invite-brand { display: inline-flex; align-items: center; gap: 9px; color: var(--text-main); text-decoration: none; font-size: 22px; font-weight: 780; letter-spacing: -.045em; }
    .invite-brand img { width: 38px; height: 38px; }
    h1 { text-align: start; font-size: clamp(2.4rem, 8vw, 4.5rem); margin-bottom: 16px; }
    .sub { margin-bottom: 28px; font-size: 17px; }
    label { color: var(--text-main); font-size: 15px; font-weight: 680; }
    textarea { min-height: 118px; margin-top: 8px; resize: vertical; }
    .row button { width: 100%; }
    #err { color: #b42318; font-size: 14px; }
    @media (max-width: 560px) {
      body { padding: 10px; }
      .box { padding: 28px 20px; border-radius: 20px; }
      .invite-top { margin-bottom: 38px; }
    }
  </style>
</head>
<body>
  <div class="box">
    <div class="invite-top">
      <span class="invite-brand"><img src="../web/assets/wecog-mark.svg" alt="">wecog</span>
      <select id="participantLanguageSelect" aria-label="Язык интерфейса">
        <option value="ru">Русский</option><option value="en">English</option><option value="zh">中文</option>
        <option value="es">Español</option><option value="hi">हिन्दी</option><option value="ar">العربية</option>
        <option value="fr">Français</option><option value="bn">বাংলা</option><option value="pt">Português</option><option value="ur">اردو</option>
      </select>
    </div>
    <h1 id="inviteTitle">Приглашение</h1>
    <p class="sub" id="inviteDescription">Вставьте ссылку или код, полученный от исследователя.</p>
    <label for="inviteRaw" id="inviteLabel">Ссылка или код</label>
    <textarea id="inviteRaw" placeholder="https://…/run_new.html?code=ABC123&#10;или: ABC123"></textarea>
    <div class="row">
      <button type="button" id="goBtn">Продолжить</button>
    </div>
    <div id="err"></div>
  </div>
  <script>
    (function () {
      var inviteLocales = {
        ru: ['Приглашение', 'Вставьте ссылку или код, полученный от исследователя.', 'Ссылка или код', 'Продолжить', 'Не удалось распознать код. Проверьте ссылку или код приглашения.'],
        en: ['Invitation', 'Paste the link or code provided by the researcher.', 'Link or code', 'Continue', 'The invitation code could not be recognized. Check the link or code.'],
        zh: ['邀请', '粘贴研究人员提供的链接或代码。', '链接或代码', '继续', '无法识别邀请码，请检查链接或代码。'],
        es: ['Invitación', 'Pegue el enlace o código proporcionado por el investigador.', 'Enlace o código', 'Continuar', 'No se pudo reconocer el código. Revise el enlace o código.'],
        hi: ['आमंत्रण', 'शोधकर्ता द्वारा दिया गया लिंक या कोड पेस्ट करें।', 'लिंक या कोड', 'आगे बढ़ें', 'आमंत्रण कोड पहचाना नहीं जा सका।'],
        ar: ['دعوة', 'الصق الرابط أو الرمز الذي أرسله الباحث.', 'الرابط أو الرمز', 'متابعة', 'تعذر التعرّف على رمز الدعوة.'],
        fr: ['Invitation', 'Collez le lien ou le code fourni par le chercheur.', 'Lien ou code', 'Continuer', 'Le code d’invitation n’a pas été reconnu.'],
        bn: ['আমন্ত্রণ', 'গবেষকের দেওয়া লিংক বা কোড পেস্ট করুন।', 'লিংক বা কোড', 'এগিয়ে যান', 'আমন্ত্রণ কোড শনাক্ত করা যায়নি।'],
        pt: ['Convite', 'Cole o link ou código fornecido pelo pesquisador.', 'Link ou código', 'Continuar', 'Não foi possível reconhecer o código do convite.'],
        ur: ['دعوت', 'محقق کا دیا ہوا لنک یا کوڈ پیسٹ کریں۔', 'لنک یا کوڈ', 'جاری رکھیں', 'دعوتی کوڈ کی شناخت نہیں ہو سکی۔']
      };
      var languageLabels = {
        ru: 'Язык интерфейса', en: 'Interface language', zh: '界面语言',
        es: 'Idioma de la interfaz', hi: 'इंटरफ़ेस की भाषा', ar: 'لغة الواجهة',
        fr: 'Langue de l’interface', bn: 'ইন্টারফেসের ভাষা',
        pt: 'Idioma da interface', ur: 'انٹرفیس کی زبان'
      };
      var alternativeLabels = {
        ru: 'или', en: 'or', zh: '或', es: 'o', hi: 'या', ar: 'أو',
        fr: 'ou', bn: 'অথবা', pt: 'ou', ur: 'یا'
      };
      var localeSelect = document.getElementById('participantLanguageSelect');
      var currentLocale = 'ru';
      function applyLocale(locale) {
        currentLocale = inviteLocales[locale] ? locale : 'ru';
        var copy = inviteLocales[currentLocale];
        document.documentElement.lang = currentLocale;
        document.documentElement.dir = currentLocale === 'ar' || currentLocale === 'ur' ? 'rtl' : 'ltr';
        document.getElementById('inviteTitle').textContent = copy[0];
        document.getElementById('inviteDescription').textContent = copy[1];
        document.getElementById('inviteLabel').textContent = copy[2];
        document.getElementById('goBtn').textContent = copy[3];
        localeSelect.setAttribute('aria-label', languageLabels[currentLocale] || languageLabels.en);
        document.getElementById('inviteRaw').setAttribute(
          'placeholder',
          'https://…/run_new.html?code=ABC123\n' + (alternativeLabels[currentLocale] || alternativeLabels.en) + ': ABC123'
        );
        document.title = 'wecog — ' + copy[0];
        try { localStorage.setItem('emocog_participant_lang', currentLocale); } catch (_) {}
      }
      localeSelect.addEventListener('change', function () { applyLocale(localeSelect.value); });
      try {
        var savedLocale = localStorage.getItem('emocog_participant_lang');
        if (inviteLocales[savedLocale]) localeSelect.value = savedLocale;
      } catch (_) {}
      applyLocale(localeSelect.value || 'ru');

      function extractCode(raw) {
        var value = String(raw || '').trim();
        if (!value) return null;
        var fromHash = function (hash) {
          var m = String(hash || '').match(/^#\/?participant\/([^/?#]+)/i);
          if (!m || !m[1]) return null;
          var c = decodeURIComponent(m[1]).trim();
          return c && /^[a-zA-Z0-9_-]+$/.test(c) ? c : null;
        };
        try {
          var u = new URL(value);
          var c = u.searchParams.get('code');
          if (c && c.trim()) return c.trim();
          c = fromHash(u.hash);
          if (c) return c;
        } catch (_) {}
        var hashOnly = fromHash(value.indexOf('#') >= 0 ? value.slice(value.indexOf('#')) : value);
        if (hashOnly) return hashOnly;
        if (value.indexOf('?') >= 0) {
          try {
            var q = value.split('?')[1] || '';
            var sp = new URLSearchParams(q);
            var c2 = sp.get('code');
            if (c2 && c2.trim()) return c2.trim();
          } catch (_) {}
        }
        if (/^https?:\/\//i.test(value)) return null;
        var code = value;
        if (code.length < 1 || code.length > 64) return null;
        if (!/^[a-zA-Z0-9_-]+$/.test(code)) return null;
        return code;
      }

      var btn = document.getElementById('goBtn');
      var ta = document.getElementById('inviteRaw');
      var err = document.getElementById('err');

      function go() {
        err.textContent = '';
        var code = extractCode(ta.value);
        if (!code) {
          err.textContent = inviteLocales[currentLocale][4];
          return;
        }
        window.location.href = 'run_new.html?code=' + encodeURIComponent(code);
      }

      btn.addEventListener('click', go);
      ta.addEventListener('keydown', function (e) {
        if (e.key === 'Enter' && e.ctrlKey) go();
      });
    })();
  </script>
</body>
</html>
