<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="referrer" content="no-referrer">
  <title>Emocog run</title>
  <link rel="icon" href="../web/assets/wecog-mark.svg" type="image/svg+xml">
</head>
<body>
  <noscript><a href="invite.html">Ввести код приглашения / Enter invitation code</a></noscript>
  <script src="../shared/invitation-link.js?v=1"></script>
  <script>
    (function () {
      var source = new URL(window.location.href);
      var invitation = window.EmocogInvitationLink.readUrl(source);
      if (invitation.code) {
        source.searchParams.set('code', invitation.code);
        window.location.replace('mvp_with_precheck_1-updated.html' + source.search + source.hash);
        return;
      }
      if (invitation.supplied) {
        window.location.replace('invite.html?invalid=1');
        return;
      }
      var role = null;
      try {
        var raw = localStorage.getItem('emocog_api_user');
        if (raw) role = JSON.parse(raw).role;
      } catch (_) {}
      if (role === 'developer' || role === 'admin') {
        try { localStorage.setItem('emocog_dev_auto_precheck', '1'); } catch (_) {}
        var u = new URL('mvp_with_precheck_1-updated.html', window.location.href);
        u.searchParams.set('developer_module', 'precheck');
        window.location.replace(u.pathname + u.search + (window.location.hash || ''));
        return;
      }
      window.location.replace('invite.html' + source.search + source.hash);
    })();
  </script>
</body>
</html>
